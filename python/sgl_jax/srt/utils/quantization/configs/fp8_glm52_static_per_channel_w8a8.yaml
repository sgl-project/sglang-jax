# GLM-5.2 offline FP8 E4M3FN per-output-channel checkpoint.
# Both regular Linear and fused-MoE activations are dynamically quantized to
# FP8 per token at runtime. Embedding, lm_head, norms, router gate, and
# indexer.weights_proj remain unquantized through their model-specific types or
# ignored-layer handling.

quantization:
  is_static_checkpoint: true
  weight_block_size: null

  linear:
    rules:
      - module_path: '.*'
        weight_dtype: 'float8_e4m3fn'
        activation_dtype: 'float8_e4m3fn'
        weight_block_size: null

  moe:
    weight_dtype: 'float8_e4m3fn'
    activation_dtype: 'float8_e4m3fn'
