# Two-host TPU v6e A/B benchmark for the legacy JAX transfer engine and Raiden.
# Render <JOB_NAME>, <ENGINE>, and <ARTIFACT_ROOT> before applying. The engine
# must be either "jax" or "raiden". Run the two variants sequentially so they
# use the same two TPU nodes without competing for network or compute.
---
apiVersion: v1
kind: Service
metadata:
  name: <JOB_NAME>-headless-svc
spec:
  clusterIP: None
  selector:
    job-name: <JOB_NAME>
---
apiVersion: batch/v1
kind: Job
metadata:
  name: <JOB_NAME>
spec:
  completionMode: Indexed
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      subdomain: <JOB_NAME>-headless-svc
      restartPolicy: Never
      serviceAccountName: gcs-account
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: "1x1"
        cloud.google.com/gke-nodepool: pd-v6e-1
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: benchmark
        image: python:3.12
        env:
        - name: ENGINE
          value: <ENGINE>
        - name: ARTIFACT_ROOT
          value: <ARTIFACT_ROOT>
        - name: P_HOST
          value: <JOB_NAME>-0.<JOB_NAME>-headless-svc
        - name: MODEL_PATH
          value: /models/DeepSeek-R1-Distill-Qwen-1.5B
        - name: SOURCE_COMMIT
          value: b859cf172e9410b87124236ea818fb389b0355fa
        - name: SOURCE_PATCH
          value: /models/raiden-cache/sglang-jax/b859cf17-raiden-control-v8/sglang-jax-main-raiden-bench.patch
        - name: SOURCE_PATCH_SHA256
          value: d2eb1534072d0bebfa103e20d36e5a88b8cfc7241a373a3c726824fc97cd73c9
        - name: RAIDEN_CACHE
          value: /models/raiden-cache/tpu-raiden-jax/87564793fda8269164e670fa4c4a44548840e153-jax0.10.2-jaxlib0.10.2-libtpu0.0.42.1-cp312-manylinux_2_31_x86_64
        - name: JAX_COMPILATION_CACHE_DIR
          value: /models/raiden-cache/jax-compilation/b859cf17-jax0.10.2-deepseek-1.5b-v6e
        - name: JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS
          value: "0"
        - name: JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES
          value: "-1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - bash
        - -lc
        - |
          set -euo pipefail

          index=${JOB_COMPLETION_INDEX}
          export JAX_COMPILATION_CACHE_DIR="${JAX_COMPILATION_CACHE_DIR}/role-${index}"
          role=consumer
          if [ "${index}" = "0" ]; then
            role=producer
          fi
          mkdir -p "${ARTIFACT_ROOT}/${role}" "${ARTIFACT_ROOT}/micro"

          finish() {
            rc=$?
            trap - EXIT
            set +e
            for file in /tmp/*.log /tmp/*.txt /tmp/*.json /tmp/*.jsonl; do
              if [ -f "${file}" ]; then
                cp "${file}" "${ARTIFACT_ROOT}/${role}/"
              fi
            done
            printf '%s\n' "${rc}" > "${ARTIFACT_ROOT}/${role}/exit_code"
            find "${JAX_COMPILATION_CACHE_DIR}" -type f 2>/dev/null | wc -l \
              > "${ARTIFACT_ROOT}/${role}/jax_compilation_cache_file_count.txt"
            du -sh "${JAX_COMPILATION_CACHE_DIR}" 2>/dev/null \
              > "${ARTIFACT_ROOT}/${role}/jax_compilation_cache_size.txt" || true
            exit "${rc}"
          }
          trap finish EXIT
          exec > >(tee /tmp/pod.log) 2>&1

          echo "engine=${ENGINE} role=${role} pod=${POD_NAME} node=${NODE_NAME}"
          printf 'engine=%s\nrole=%s\npod=%s\nnode=%s\nartifact_root=%s\n' \
            "${ENGINE}" "${role}" "${POD_NAME}" "${NODE_NAME}" "${ARTIFACT_ROOT}" \
            > /tmp/runtime_identity.txt
          test "${ENGINE}" = "jax" || test "${ENGINE}" = "raiden"
          test -s "${SOURCE_PATCH}"
          echo "${SOURCE_PATCH_SHA256}  ${SOURCE_PATCH}" | sha256sum -c -
          test -s "${RAIDEN_CACHE}/READY"
          test -s "${RAIDEN_CACHE}/TPU_SMOKE_OK"
          wheel_name=$(cat "${RAIDEN_CACHE}/READY")
          test "${wheel_name}" = "$(cat "${RAIDEN_CACHE}/TPU_SMOKE_OK")"

          apt-get update -qq
          apt-get install -y -qq curl git iproute2 procps >/dev/null
          python -m pip install -q uv
          uv venv /tmp/sglang-venv
          source /tmp/sglang-venv/bin/activate

          git clone --filter=blob:none https://github.com/sgl-project/sglang-jax.git /tmp/sglang-jax
          cd /tmp/sglang-jax
          git checkout --detach "${SOURCE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          git apply --check "${SOURCE_PATCH}"
          git apply "${SOURCE_PATCH}"

          export UV_FIND_LINKS=https://storage.googleapis.com/jax-releases/libtpu_releases.html
          uv pip install -e 'python[all]'
          mkdir -p /tmp/raiden-wheel
          cp "${RAIDEN_CACHE}/${wheel_name}" "${RAIDEN_CACHE}/SHA256SUMS" /tmp/raiden-wheel/
          cd /tmp/raiden-wheel
          sha256sum -c SHA256SUMS
          uv pip install --no-deps "./${wheel_name}"
          uv pip install tpu-info==0.7.1
          uv pip check
          cd /tmp/sglang-jax

          if [ "${ENGINE}" = "raiden" ]; then
            export SGLANG_JAX_USE_RAIDEN=1
          else
            unset SGLANG_JAX_USE_RAIDEN
          fi

          python - "${ENGINE}" "${SOURCE_COMMIT}" "${wheel_name}" > /tmp/versions.json <<'PY'
          import importlib.metadata as md
          import json
          import sys

          if sys.argv[1] == "raiden":
              from tpu_raiden.frameworks.jax import _tpu_raiden_jax  # noqa: F401
          import jax
          import jaxlib

          assert jax.__version__ == "0.10.2"
          assert jaxlib.__version__ == "0.10.2"
          assert md.version("libtpu") == "0.0.42.1"
          print(json.dumps({
              "engine": sys.argv[1],
              "sglang_commit": sys.argv[2],
              "raiden_wheel": sys.argv[3],
              "jax": jax.__version__,
              "jaxlib": jaxlib.__version__,
              "libtpu": md.version("libtpu"),
              "devices": [str(device) for device in jax.devices("tpu")],
          }, sort_keys=True))
          PY
          uv pip freeze > /tmp/python_packages.txt
          ip -br addr > /tmp/ip_addr.txt
          ip link show eth0 > /tmp/eth0.txt

          python scripts/disaggregation/benchmark_transfer_engines.py \
            --engine "${ENGINE}" \
            --role "${role}" \
            --producer-host "${P_HOST}" \
            --artifact-root "${ARTIFACT_ROOT}/micro" \
            --blocks 1,4,16,32,64 \
            --warmup 5 \
            --iterations 30 \
            2>&1 | tee /tmp/micro_${role}.log

          # The microbenchmark process owns the initial TPU runtime. Let it exit
          # fully before starting the serving runtime in a fresh process.
          sleep 5
          engine_args=()
          if [ "${ENGINE}" = "raiden" ]; then
            engine_args+=(--disaggregation-use-raiden)
          fi

          if [ "${index}" = "0" ]; then
            python -m sgl_jax.srt.disaggregation.run_bootstrap \
              --host 0.0.0.0 --port 8998 \
              > >(tee /tmp/bootstrap.log) 2>&1 &
            bootstrap_pid=$!
            sleep 3

            python -m sgl_jax.launch_server \
              --model-path "${MODEL_PATH}" \
              --host 0.0.0.0 --port 10000 \
              --page-size 128 \
              --disable-radix-cache \
              --enable-request-time-stats-logging \
              --disaggregation-mode prefill \
              --disaggregation-bootstrap-url "http://${P_HOST}:8998" \
              --disaggregation-channel-number 4 \
              --disaggregation-max-inflight-transfers 8 \
              --chunked-prefill-size 4096 \
              --mem-fraction-static 0.70 \
              --enable-metrics \
              "${engine_args[@]}" \
              > >(tee /tmp/prefill_server.log) 2>&1 &
            prefill_pid=$!

            for _ in $(seq 1 300); do
              if curl -sf http://localhost:10000/health >/dev/null; then break; fi
              sleep 2
            done
            curl -sS -o /tmp/prefill_health.json -w '%{http_code}\n' \
              http://localhost:10000/health > /tmp/prefill_health_code.txt
            test "$(cat /tmp/prefill_health_code.txt)" = "200"
            pgrep -af 'sgl_jax.launch_server' > /tmp/prefill_server_process.txt

            for _ in $(seq 1 3600); do
              if [ -f "${ARTIFACT_ROOT}/DRIVER_DONE" ]; then break; fi
              sleep 2
            done
            test -f "${ARTIFACT_ROOT}/DRIVER_DONE"
            kill -TERM "${prefill_pid}" "${bootstrap_pid}" 2>/dev/null || true
            wait "${prefill_pid}" "${bootstrap_pid}" 2>/dev/null || true
          else
            for _ in $(seq 1 300); do
              if curl -sf "http://${P_HOST}:8998/health" >/dev/null; then break; fi
              sleep 2
            done
            curl -sf "http://${P_HOST}:8998/health" >/dev/null
            for _ in $(seq 1 300); do
              if curl -sf "http://${P_HOST}:10000/health" >/dev/null; then break; fi
              sleep 2
            done
            curl -sf "http://${P_HOST}:10000/health" >/dev/null

            python -m sgl_jax.launch_server \
              --model-path "${MODEL_PATH}" \
              --host 0.0.0.0 --port 10001 \
              --page-size 128 \
              --disable-radix-cache \
              --enable-request-time-stats-logging \
              --disaggregation-mode decode \
              --disaggregation-bootstrap-url "http://${P_HOST}:8998" \
              --disaggregation-channel-number 4 \
              --disaggregation-max-inflight-transfers 8 \
              --chunked-prefill-size 4096 \
              --mem-fraction-static 0.70 \
              --enable-metrics \
              "${engine_args[@]}" \
              > >(tee /tmp/decode_server.log) 2>&1 &
            decode_pid=$!

            for _ in $(seq 1 300); do
              if curl -sf http://localhost:10001/health >/dev/null; then break; fi
              sleep 2
            done
            curl -sS -o /tmp/decode_health.json -w '%{http_code}\n' \
              http://localhost:10001/health > /tmp/decode_health_code.txt
            test "$(cat /tmp/decode_health_code.txt)" = "200"

            python -m sgl_jax.srt.disaggregation.launch_router \
              --pd-disaggregation --mini-lb \
              --prefill "http://${P_HOST}:10000" 8998 \
              --decode http://localhost:10001 \
              --prefill-bootstrap-host "${P_HOST}" \
              --max-concurrent-requests 64 \
              --host 0.0.0.0 --port 30000 \
              > >(tee /tmp/router.log) 2>&1 &
            router_pid=$!

            for _ in $(seq 1 120); do
              if curl -sf http://localhost:30000/health >/dev/null; then break; fi
              sleep 2
            done
            curl -sS -o /tmp/router_health.json -w '%{http_code}\n' \
              http://localhost:30000/health > /tmp/router_health_code.txt
            test "$(cat /tmp/router_health_code.txt)" = "200"
            curl -sf http://localhost:30000/v1/models > /tmp/models.json
            pgrep -af 'sgl_jax.launch_server' > /tmp/decode_server_process.txt
            pgrep -af 'launch_router' > /tmp/router_process.txt

            # Explicit warmup before each workload keeps warmup requests out of
            # the measured result files and the PD time-stats slice.
            python -m sgl_jax.bench_serving \
              --backend sgl-jax --base-url http://localhost:30000 \
              --model "${MODEL_PATH}" --dataset-name random \
              --random-input-len 4096 --random-output-len 1 \
              --random-range-ratio 1 --num-prompts 8 --max-concurrency 4 \
              --warmup-requests 0 --output-file /tmp/transfer_warmup.jsonl

            transfer_start_line=$(wc -l < /tmp/decode_server.log)
            bash .claude/skills/model-speed-benchmark/scripts/speed_benchmark.sh \
              --python-bin /tmp/sglang-venv/bin/python \
              --host 127.0.0.1 --port 30000 \
              --model "${MODEL_PATH}" --dataset-name random \
              --out "${ARTIFACT_ROOT}/serving/transfer" \
              --batch-sizes "1 4 8" --num-prompts-multiplier 5 \
              -- --random-input-len 4096 --random-output-len 1 \
                 --random-range-ratio 1 --warmup-requests 0 \
              2>&1 | tee /tmp/transfer_benchmark.log
            tail -n "+$((transfer_start_line + 1))" /tmp/decode_server.log \
              > /tmp/transfer_decode_stats.log

            python -m sgl_jax.bench_serving \
              --backend sgl-jax --base-url http://localhost:30000 \
              --model "${MODEL_PATH}" --dataset-name random \
              --random-input-len 4096 --random-output-len 256 \
              --random-range-ratio 1 --num-prompts 8 --max-concurrency 4 \
              --warmup-requests 0 --output-file /tmp/serving_warmup.jsonl

            bash .claude/skills/model-speed-benchmark/scripts/speed_benchmark.sh \
              --python-bin /tmp/sglang-venv/bin/python \
              --host 127.0.0.1 --port 30000 \
              --model "${MODEL_PATH}" --dataset-name random \
              --out "${ARTIFACT_ROOT}/serving/realistic" \
              --batch-sizes "1 4 8" --num-prompts-multiplier 3 \
              -- --random-input-len 4096 --random-output-len 256 \
                 --random-range-ratio 1 --warmup-requests 0 \
              2>&1 | tee /tmp/realistic_benchmark.log

            python - /tmp/transfer_decode_stats.log \
              "${ARTIFACT_ROOT}/serving/transfer/kv_wait_summary.json" <<'PY'
          import json
          import re
          import statistics
          import sys

          values = []
          for line in open(sys.argv[1], encoding="utf-8"):
              if "PD-TIME-STATS role=decode" not in line:
                  continue
              match = re.search(r"\bkv_wait=([0-9.]+)ms", line)
              if match:
                  values.append(float(match.group(1)))
          if not values:
              raise SystemExit("no decode kv_wait samples found")

          def percentile(p):
              ordered = sorted(values)
              position = (len(ordered) - 1) * p
              lower = int(position)
              upper = min(lower + 1, len(ordered) - 1)
              fraction = position - lower
              return ordered[lower] * (1 - fraction) + ordered[upper] * fraction

          logical_bytes = 28 * 4096 * 2 * 2 * 128 * 2
          result = {
              "samples": len(values),
              "logical_bytes_per_request": logical_bytes,
              "latency_mean_ms": statistics.mean(values),
              "latency_p50_ms": percentile(0.50),
              "latency_p95_ms": percentile(0.95),
              "latency_p99_ms": percentile(0.99),
              "effective_bandwidth_mean_gbps": statistics.mean(
                  logical_bytes / (value / 1000) / 1e9 for value in values
              ),
              "effective_bandwidth_p50_gbps": percentile(0.50) and (
                  logical_bytes / (percentile(0.50) / 1000) / 1e9
              ),
          }
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              json.dump(result, output, indent=2, sort_keys=True)
              output.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

            grep -cE 'RESOURCE_EXHAUSTED|failed to extract KV|aborting|Traceback' \
              /tmp/decode_server.log > /tmp/decode_error_marker_count.txt || true
            printf 'ok\n' > "${ARTIFACT_ROOT}/DRIVER_DONE"
            kill -TERM "${router_pid}" "${decode_pid}" 2>/dev/null || true
            wait "${router_pid}" "${decode_pid}" 2>/dev/null || true
          fi
        resources:
          requests:
            cpu: "12"
            memory: 64Gi
            ephemeral-storage: 32Gi
            google.com/tpu: 1
          limits:
            cpu: "32"
            memory: 128Gi
            ephemeral-storage: 40Gi
            google.com/tpu: 1
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model-storage
          mountPath: /models
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: model-storage
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: model-storage-sglang
            mountOptions: "implicit-dirs,metadata-cache:ttl-secs:0,metadata-cache:stat-cache-max-size-mb:512,metadata-cache:type-cache-max-size-mb:64,file-cache:max-size-mb:5120,file-cache:cache-file-for-range-read:true,file-system:kernel-list-cache-ttl-secs:0,file-cache:enable-parallel-downloads:true,file-cache:parallel-downloads-per-file:32"
