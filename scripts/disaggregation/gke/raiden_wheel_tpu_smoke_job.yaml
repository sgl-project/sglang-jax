# Validate the cached Raiden wheel on one v6e chip. The READY marker means the
# wheel was built and checksummed; TPU_SMOKE_OK is written only after native
# imports and a real D2H/H2D round trip succeed.
apiVersion: batch/v1
kind: Job
metadata:
  name: raiden-wheel-smoke-jax0102-8756479
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: gcs-account
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: "1x1"
        cloud.google.com/gke-nodepool: pd-v6e-1
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: smoke
        image: python:3.12
        env:
        - name: RAIDEN_COMMIT
          value: 87564793fda8269164e670fa4c4a44548840e153
        - name: CACHE_ROOT
          value: /models/raiden-cache/tpu-raiden-jax/87564793fda8269164e670fa4c4a44548840e153-jax0.10.2-jaxlib0.10.2-libtpu0.0.42.1-cp312-manylinux_2_31_x86_64
        command:
        - bash
        - -lc
        - |
          set -euxo pipefail

          test -s "${CACHE_ROOT}/READY"
          test -s "${CACHE_ROOT}/SHA256SUMS"
          wheel_name=$(cat "${CACHE_ROOT}/READY")
          test -s "${CACHE_ROOT}/${wheel_name}"

          apt-get update -qq
          apt-get install -y -qq git >/dev/null
          python -m venv /tmp/raiden-venv
          source /tmp/raiden-venv/bin/activate
          python -m pip install -q --upgrade pip

          mkdir -p /tmp/raiden-wheel
          cp "${CACHE_ROOT}/${wheel_name}" "${CACHE_ROOT}/SHA256SUMS" /tmp/raiden-wheel/
          cd /tmp/raiden-wheel
          sha256sum -c SHA256SUMS
          python -m pip install "./${wheel_name}" \
            --find-links https://storage.googleapis.com/jax-releases/libtpu_releases.html
          python -m pip check

          python - <<'PY'
          import importlib.metadata as md

          from tpu_raiden.frameworks.jax import _tpu_raiden_jax
          from tpu_raiden.frameworks.jax import _kv_cache_manager_ffi
          from tpu_raiden.frameworks.jax import _weight_synchronizer_ffi
          import jax
          import jaxlib

          assert jax.__version__ == "0.10.2", jax.__version__
          assert jaxlib.__version__ == "0.10.2", jaxlib.__version__
          assert md.version("libtpu") == "0.0.42.1", md.version("libtpu")
          devices = jax.devices("tpu")
          assert devices, "No TPU device found"
          print("Raiden native import OK:", devices)
          PY

          git clone https://github.com/google/tpu-raiden.git /tmp/tpu-raiden
          git -C /tmp/tpu-raiden checkout "${RAIDEN_COMMIT}"
          cd /tmp/tpu-raiden
          python -c '
          import runpy
          import sys
          from tpu_raiden.frameworks.jax import _tpu_raiden_jax
          sys.argv = [
              "kv_cache_manager_test.py",
              "--device_type=tpu",
              "KVCacheManagerTest.test_e2e_shift_copy_bf16",
          ]
          runpy.run_path(
              "/tmp/tpu-raiden/tpu_raiden/frameworks/jax/kv_cache_manager_test.py",
              run_name="__main__",
          )
          '

          printf '%s\n' "${wheel_name}" > "${CACHE_ROOT}/TPU_SMOKE_OK"
          cat "${CACHE_ROOT}/TPU_SMOKE_OK"
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            ephemeral-storage: 20Gi
            google.com/tpu: 1
          limits:
            cpu: "16"
            memory: 64Gi
            ephemeral-storage: 30Gi
            google.com/tpu: 1
        volumeMounts:
        - name: model-storage
          mountPath: /models
      volumes:
      - name: model-storage
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: model-storage-sglang
            mountOptions: "implicit-dirs,metadata-cache:ttl-secs:0,metadata-cache:stat-cache-max-size-mb:64,metadata-cache:type-cache-max-size-mb:64,file-cache:max-size-mb:2048,file-cache:cache-file-for-range-read:true"
