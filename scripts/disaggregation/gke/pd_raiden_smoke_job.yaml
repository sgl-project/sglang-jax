# Two-host P/D correctness smoke using the cached Raiden wheel. Both pods clone
# PR #1461 at its exact head and apply the checksummed local integration patch
# from /models; no Raiden compilation occurs in this job.
---
apiVersion: v1
kind: Service
metadata:
  name: pd-raiden-smoke-headless-svc
spec:
  clusterIP: None
  selector:
    job-name: pd-raiden-smoke
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pd-raiden-smoke
spec:
  completionMode: Indexed
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      subdomain: pd-raiden-smoke-headless-svc
      restartPolicy: Never
      serviceAccountName: gcs-account
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: "1x1"
        cloud.google.com/gke-nodepool: pd-v6e-1
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: server
        image: python:3.12
        env:
        - name: P_HOST
          value: pd-raiden-smoke-0.pd-raiden-smoke-headless-svc
        - name: MODEL_PATH
          value: /models/DeepSeek-R1-Distill-Qwen-1.5B
        - name: PR_HEAD
          value: e6a01478f6e624243013b4aa75a85c1b368bbdf4
        - name: SOURCE_PATCH
          value: /models/raiden-cache/sglang-jax/e6a01478-raiden-control-v1/sglang-jax-pr1461-raiden.patch
        - name: SOURCE_PATCH_SHA256
          value: 7e0a8fa104f2028d75cfea8f6d383915bb9b938b3f5f0a8d59b35de330693a2d
        - name: RAIDEN_CACHE
          value: /models/raiden-cache/tpu-raiden-jax/87564793fda8269164e670fa4c4a44548840e153-jax0.10.2-jaxlib0.10.2-libtpu0.0.42.1-cp312-manylinux_2_31_x86_64
        - name: SGLANG_JAX_USE_RAIDEN
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        command:
        - bash
        - -lc
        - |
          set -euxo pipefail

          test -s "${RAIDEN_CACHE}/READY"
          test -s "${RAIDEN_CACHE}/TPU_SMOKE_OK"
          wheel_name=$(cat "${RAIDEN_CACHE}/READY")
          test "${wheel_name}" = "$(cat "${RAIDEN_CACHE}/TPU_SMOKE_OK")"

          apt-get update -qq
          apt-get install -y -qq git curl iproute2 >/dev/null
          python -m pip install -q uv
          uv venv /tmp/sglang-venv
          source /tmp/sglang-venv/bin/activate

          git clone https://github.com/sgl-project/sglang-jax.git /tmp/sglang-jax
          cd /tmp/sglang-jax
          git fetch origin "pull/1461/head:pr1461"
          git checkout --detach "${PR_HEAD}"
          test "$(git rev-parse HEAD)" = "${PR_HEAD}"
          cp "${SOURCE_PATCH}" /tmp/sglang-jax-raiden.patch
          echo "${SOURCE_PATCH_SHA256}  /tmp/sglang-jax-raiden.patch" | sha256sum -c -
          git apply --check /tmp/sglang-jax-raiden.patch
          git apply /tmp/sglang-jax-raiden.patch

          export UV_FIND_LINKS=https://storage.googleapis.com/jax-releases/libtpu_releases.html
          uv pip install -e 'python[all]'
          mkdir -p /tmp/raiden-wheel
          cp "${RAIDEN_CACHE}/${wheel_name}" "${RAIDEN_CACHE}/SHA256SUMS" /tmp/raiden-wheel/
          cd /tmp/raiden-wheel
          sha256sum -c SHA256SUMS
          uv pip install "./${wheel_name}"
          uv pip check

          cd /tmp/sglang-jax
          python - <<'PY'
          import importlib.metadata as md
          from tpu_raiden.frameworks.jax import _tpu_raiden_jax
          import jax
          import jaxlib

          assert jax.__version__ == "0.10.2"
          assert jaxlib.__version__ == "0.10.2"
          assert md.version("libtpu") == "0.0.42.1"
          print("runtime stack:", jax.__version__, jaxlib.__version__, md.version("libtpu"))
          print("TPU devices:", jax.devices("tpu"))
          PY

          index=${JOB_COMPLETION_INDEX}
          echo "Starting Raiden PD role index=${index}"
          if [ "${index}" = "0" ]; then
            python -m sgl_jax.srt.disaggregation.run_bootstrap \
              --host 0.0.0.0 --port 8998 \
              2>&1 | tee /tmp/bootstrap.log &
            sleep 3

            python -m sgl_jax.launch_server \
              --model-path "${MODEL_PATH}" \
              --host 0.0.0.0 --port 10000 \
              --page-size 128 \
              --disable-radix-cache \
              --disaggregation-mode prefill \
              --disaggregation-bootstrap-url "http://${P_HOST}:8998" \
              --disaggregation-use-raiden \
              --disaggregation-max-inflight-transfers 4 \
              --chunked-prefill-size 4096 \
              --mem-fraction-static 0.70 \
              2>&1 | tee /tmp/prefill_server.log &

            for _ in $(seq 1 300); do
              curl -sf http://localhost:10000/health && break
              sleep 2
            done
            curl -sf http://localhost:10000/health
            echo "PREFILL_RAIDEN_READY"
            sleep 1800
          else
            for _ in $(seq 1 300); do
              curl -sf "http://${P_HOST}:8998/health" && break
              sleep 2
            done
            curl -sf "http://${P_HOST}:8998/health"
            for _ in $(seq 1 300); do
              curl -sf "http://${P_HOST}:10000/health" && break
              sleep 2
            done
            curl -sf "http://${P_HOST}:10000/health"

            python -m sgl_jax.launch_server \
              --model-path "${MODEL_PATH}" \
              --host 0.0.0.0 --port 10001 \
              --page-size 128 \
              --disable-radix-cache \
              --disaggregation-mode decode \
              --disaggregation-bootstrap-url "http://${P_HOST}:8998" \
              --disaggregation-use-raiden \
              --disaggregation-max-inflight-transfers 4 \
              --chunked-prefill-size 4096 \
              --mem-fraction-static 0.70 \
              2>&1 | tee /tmp/decode_server.log &

            for _ in $(seq 1 300); do
              curl -sf http://localhost:10001/health && break
              sleep 2
            done
            curl -sf http://localhost:10001/health

            python -m sgl_jax.srt.disaggregation.launch_router \
              --pd-disaggregation --mini-lb \
              --prefill "http://${P_HOST}:10000" 8998 \
              --decode http://localhost:10001 \
              --prefill-bootstrap-host "${P_HOST}" \
              --max-concurrent-requests 4 \
              --host 0.0.0.0 --port 30000 \
              2>&1 | tee /tmp/router.log &

            for _ in $(seq 1 120); do
              curl -sf http://localhost:30000/health && break
              sleep 2
            done
            curl -sf http://localhost:30000/health

            curl -sf http://localhost:30000/generate \
              -H 'Content-Type: application/json' \
              -d '{"text":"The capital of France is","sampling_params":{"temperature":0,"max_new_tokens":16}}' \
              | tee /tmp/raiden_response.json
            test -s /tmp/raiden_response.json

            python -m sgl_jax.bench_serving \
              --backend sgl-jax \
              --base-url http://localhost:30000 \
              --model "${MODEL_PATH}" \
              --dataset-name random \
              --random-input-len 128 \
              --random-output-len 16 \
              --num-prompts 4 \
              --max-concurrency 2 \
              --warmup-requests 1 \
              --output-file /tmp/raiden_bench.jsonl
            cat /tmp/raiden_bench.jsonl
            grep -E 'raiden data plane enabled|Raiden|raiden' /tmp/decode_server.log | tail -n 80
            echo "PD_RAIDEN_E2E_OK"
          fi
        resources:
          requests:
            cpu: "12"
            memory: 64Gi
            ephemeral-storage: 32Gi
            google.com/tpu: 1
          limits:
            cpu: "32"
            memory: 128Gi
            ephemeral-storage: 40Gi
            google.com/tpu: 1
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model-storage
          mountPath: /models
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: model-storage
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: model-storage-sglang
            mountOptions: "implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:512,metadata-cache:type-cache-max-size-mb:64,file-cache:max-size-mb:5120,file-cache:cache-file-for-range-read:true,file-system:kernel-list-cache-ttl-secs:-1,file-cache:enable-parallel-downloads:true,file-cache:parallel-downloads-per-file:32"
