# GLM-5.2 timing closure run. First collect an unprofiled E2E baseline, then
# capture one cache-hit C32 extend forward and reject incomplete XPlanes on pod.
name: glm52-timing-closure-dp16-c32-128k-profile-20260810-r7-private-oproj-client-timing
exp_type: PROFILING
artifact_type: trace
cluster_name: tpu-training-antgroup
profile: true
tags:
  - profile
  - timing-closure
  - runtime-coverage-gate
  - glm52
  - fused-moe-v2
  - radix-topk
  - dp16
  - ep16
  - cache-hit
  - bounded-sparsecore
model_version: d7149c277c530fdf5c2835988ce09743ce080f5d
config: '{"model":"GLM-5.2-FP8","tp":16,"dp":16,"ep":16,"physical_chips":8,"jax_devices":16,"prefix_tokens":131072,"extend_sequences_per_dp":2,"extend_tokens_per_sequence":1024,"e2e_decode_tokens":1024,"profile_decode_tokens":1,"concurrency":32,"profile_mode":"stage_prefill_admission_barrier_fifo_device_completion_one_chip_sparsecore_1x1_client_phase_timing","profile_max_hosts":1,"profile_num_chips_per_task":1,"profile_num_sparse_cores":1,"profile_num_sparse_core_tiles":1,"load_time_bf16_linears":["o_proj"],"source_commit":"d7149c277c530fdf5c2835988ce09743ce080f5d"}'
role_to_task_spec:
  worker:
    command: |
      bash <<'BASH'
      set -euo pipefail
      ulimit -c 0

      export PYTHONUNBUFFERED=1
      export TMPDIR="${TMPDIR:-/tmp/tpu_logs/tmp}"
      export PIP_CACHE_DIR="${PIP_CACHE_DIR:-/tmp/tpu_logs/pip-cache}"
      export UV_CACHE_DIR="${UV_CACHE_DIR:-/tmp/tpu_logs/uv-cache}"
      export JAX_COMPILATION_CACHE_DIR="${JAX_COMPILATION_CACHE_DIR:-/tmp/tpu_logs/jax-compilation-cache}"
      export SGLANG_PROFILE_MAX_HOSTS=1
      export SGLANG_PROFILE_NUM_CHIPS_PER_TASK=1
      export SGLANG_PROFILE_NUM_SPARSE_CORES_TO_TRACE=1
      export SGLANG_PROFILE_NUM_SPARSE_CORE_TILES_TO_TRACE=1
      export LIBTPU_INIT_ARGS="${LIBTPU_INIT_ARGS:+$LIBTPU_INIT_ARGS }--xla_tpu_dvfs_p_state=7"

      SOURCE_COMMIT=d7149c277c530fdf5c2835988ce09743ce080f5d
      OUT="${ARTIFACT_LOCAL_DIR:-/tmp/glm52-timing-closure-artifact}"
      RANK="${FALCON_RANK:-${FALCON_JAX_PROCESS_ID:-${JOB_COMPLETION_INDEX:-0}}}"
      WORLD="${FALCON_WORLD_SIZE:-2}"
      MODEL_PATH=/models/GLM-5.2-FP8
      POD_HOST="$(hostname)"
      JOB_BASE="${POD_HOST%-*}"
      MASTER_ADDR="$JOB_BASE-0.$JOB_BASE"
      RANK_OUT="$OUT/rank-$RANK"
      LOCAL_ROOT="/tmp/tpu_logs/glm52-timing-closure-rank-$RANK"
      LOCAL_PROFILE="/tmp/tpu_logs/glm52-timing-closure-profile-rank-0/prefill"
      ARTIFACT_PROFILE="$OUT/profiling/prefill/rank-0"
      SERVER_LOG="$LOCAL_ROOT/server.log"
      SERVER_PID=0
      TAIL_PID=0

      mkdir -p "$RANK_OUT" "$OUT/workload" "$OUT/profiling" "$LOCAL_ROOT" \
        "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      # This Falcon identity has no credential for the private model-serving
      # repository. The controller copies a clean, exact-HEAD archive to both
      # ranks immediately after submission.
      for _ in $(seq 1 1800); do
        if [ -s /tmp/sglang-source.tar.gz ] && \
           gzip -t /tmp/sglang-source.tar.gz 2>/dev/null; then
          break
        fi
        sleep 1
      done
      test -s /tmp/sglang-source.tar.gz
      mkdir -p /workspace/sglang-jax
      tar -xzf /tmp/sglang-source.tar.gz -C /workspace/sglang-jax
      cd /workspace/sglang-jax
      test "$(cat .source-revision)" = "$SOURCE_COMMIT"
      cp .source-revision "$RANK_OUT/source-revision.txt"
      python3 -m pip install -q --upgrade pip uv
      uv venv --python 3.12 --seed /tmp/tpu_logs/glm52-timing-closure-venv
      . /tmp/tpu_logs/glm52-timing-closure-venv/bin/activate
      uv pip install -q -e python pytest 'jax[tpu]==0.10.1'
      export PYTHONPATH=/workspace/sglang-jax/python:${PYTHONPATH:-}

      python3 - <<'PY'
      import jax
      import jaxlib

      expected = "0.10.1"
      if jax.__version__ != expected or jaxlib.__version__ != expected:
          raise SystemExit(
              f"expected jax/jaxlib {expected}, got "
              f"jax={jax.__version__} jaxlib={jaxlib.__version__}"
          )
      PY

      env -u SGLANG_PROFILE_MAX_HOSTS -u SGLANG_PROFILE_NUM_CHIPS_PER_TASK \
        -u SGLANG_PROFILE_NUM_SPARSE_CORES_TO_TRACE \
        -u SGLANG_PROFILE_NUM_SPARSE_CORE_TILES_TO_TRACE \
        python3 -m pytest -q \
          python/sgl_jax/test/test_profiler_tracer_levels.py \
          python/sgl_jax/test/test_tp_worker_overlap_thread.py \
          python/sgl_jax/test/test_glm5_load_dequant.py \
          benchmark/glm52/xplane_runtime_coverage_test.py \
          > "$RANK_OUT/timing-closure-tests.txt" 2>&1

      python3 - <<'PY' > "$RANK_OUT/runtime-versions.txt"
      import importlib.metadata as md
      for package in ("jax", "jaxlib", "libtpu", "sglang-jax", "transformers"):
          try:
              print(f"{package}={md.version(package)}")
          except md.PackageNotFoundError:
              print(f"{package}=MISSING")
      PY

      python3 - "$MODEL_PATH" <<'PY' > "$RANK_OUT/model-config-check.json"
      import json
      import pathlib
      import sys

      model_path = pathlib.Path(sys.argv[1])
      required = (
          model_path / "config.json",
          model_path / "model.safetensors.index.json",
          model_path / "_DOWNLOAD_COMPLETE",
      )
      if not all(path.is_file() for path in required):
          raise SystemExit(f"incomplete model mount: {model_path}")
      config = json.loads(required[0].read_text())
      quant = config.get("quantization_config")
      if not isinstance(quant, dict) or quant.get("quant_method") != "fp8":
          raise SystemExit(f"unexpected quantization config: {quant}")
      print(json.dumps({
          "model_type": config.get("model_type"),
          "architectures": config.get("architectures"),
          "quantization_config": quant,
      }, indent=2, sort_keys=True))
      PY

      stop_process() {
        local pid="$1"
        if [ "$pid" -le 0 ]; then
          return
        fi
        kill "$pid" 2>/dev/null || true
        for _ in $(seq 1 30); do
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" 2>/dev/null || true
            return
          fi
          sleep 1
        done
        kill -9 "$pid" 2>/dev/null || true
        wait "$pid" 2>/dev/null || true
      }

      cleanup_rank0() {
        set +e
        touch "$OUT/PROFILE_CAPTURED"
        stop_process "$SERVER_PID"
        stop_process "$TAIL_PID"
        cp "$SERVER_LOG" "$RANK_OUT/server.log" 2>/dev/null || true
      }

      echo "GLM52_TIMING_CLOSURE_SERVER_LAUNCH rank=$RANK world=$WORLD host=$POD_HOST master=$MASTER_ADDR"
      python3 -m sgl_jax.launch_server \
        --model-path "$MODEL_PATH" \
        --trust-remote-code \
        --device tpu \
        --dtype bfloat16 \
        --kv-cache-dtype bf16 \
        --attention-backend dsa_sparse \
        --dsa-sparse-impl exact \
        --dsa-topk-impl radix \
        --dsa-use-pallas \
        --page-size 64 \
        --chunked-prefill-size 2048 \
        --max-prefill-tokens 32768 \
        --context-length 135168 \
        --tp-size 16 \
        --dp-size 16 \
        --dp-schedule-policy round_robin \
        --ep-size 16 \
        --moe-backend fused_v2 \
        --mem-fraction-static 0.83 \
        --max-running-requests 32 \
        --precompile-bs-paddings 32 \
        --precompile-token-paddings 32768 \
        --skip-server-warmup \
        --random-seed 3 \
        --stream-output \
        --stream-interval 1 \
        --nnodes "$WORLD" \
        --node-rank "$RANK" \
        --dist-init-addr "$MASTER_ADDR:25000" \
        --host 0.0.0.0 \
        --port 30000 \
        >"$SERVER_LOG" 2>&1 &
      SERVER_PID=$!
      tail -n +1 -F "$SERVER_LOG" &
      TAIL_PID=$!

      if [ "$RANK" != "0" ]; then
        while [ ! -f "$OUT/PROFILE_CAPTURED" ]; do
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "GLM52_TIMING_CLOSURE_SERVER_DIED rank=$RANK"
            cp "$SERVER_LOG" "$RANK_OUT/server.log" 2>/dev/null || true
            exit 1
          fi
          sleep 2
        done
        stop_process "$SERVER_PID"
        stop_process "$TAIL_PID"
        cp "$SERVER_LOG" "$RANK_OUT/server.log"
        echo "GLM52_TIMING_CLOSURE_RANK_COMPLETE rank=$RANK"
        exit 0
      fi

      trap cleanup_rank0 EXIT
      READY=0
      for i in $(seq 1 1080); do
        if ! kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "GLM52_TIMING_CLOSURE_SERVER_DIED_BEFORE_READY rank=0"
          exit 1
        fi
        if curl -sf http://localhost:30000/get_server_info > "$OUT/server-info-ready.json"; then
          echo "GLM52_TIMING_CLOSURE_SERVER_READY elapsed_seconds=$((i * 10))"
          READY=1
          break
        fi
        sleep 10
      done
      if [ "$READY" != "1" ]; then
        echo "GLM52_TIMING_CLOSURE_SERVER_READY_TIMEOUT seconds=10800"
        exit 1
      fi

      # Unprofiled formal-shape E2E baseline from the exact source and server.
      python3 benchmark/glm52/bench_dsa_cache_hit.py \
        --base-url http://localhost:30000 \
        --concurrency 32 \
        --dp-size 16 \
        --prefix-mode shared \
        --prefix-len 131072 \
        --extend-len 1024 \
        --output-len 1024 \
        --random-seed 3 \
        --variant timing_closure_e2e \
        --cache-hit-tolerance 64 \
        --output "$OUT/workload/e2e-metrics.jsonl" \
        2>&1 | tee "$OUT/workload/e2e.log"
      echo "GLM52_TIMING_CLOSURE_E2E_COMPLETE"

      # Capture only the next C32 extend forward. Admission is held until the
      # stage trigger is armed; manual stop is a fallback when output_len=1.
      python3 benchmark/glm52/bench_dsa_cache_hit.py \
        --base-url http://localhost:30000 \
        --concurrency 32 \
        --dp-size 16 \
        --prefix-mode shared \
        --prefix-len 131072 \
        --extend-len 1024 \
        --output-len 1 \
        --random-seed 107 \
        --variant timing_closure_profile \
        --cache-hit-tolerance 64 \
        --profile-output-dir "$LOCAL_PROFILE" \
        --profile-host-tracer-level 0 \
        --profile-python-tracer-level 0 \
        --profile-num-steps 1 \
        --profile-by-stage \
        --profile-stages prefill \
        --profile-admission-barrier \
        --output "$OUT/workload/profile-metrics.jsonl" \
        2>&1 | tee "$OUT/workload/profile.log"
      echo "GLM52_TIMING_CLOSURE_PROFILE_CAPTURE_COMPLETE"

      curl -sf http://localhost:30000/profile_status > "$OUT/profile-status-final.json"
      python3 - "$OUT/profile-status-final.json" <<'PY'
      import json
      import pathlib
      import sys

      status = json.loads(pathlib.Path(sys.argv[1]).read_text())
      if status.get("status") != "idle":
          raise SystemExit(f"profiler did not flush: {status}")
      PY

      # Release the peer, stop both serving processes, then inspect the local
      # XPlane without competing with model host memory.
      touch "$OUT/PROFILE_CAPTURED"
      stop_process "$SERVER_PID"
      stop_process "$TAIL_PID"
      cp "$SERVER_LOG" "$RANK_OUT/server.log"

      set +e
      python3 benchmark/glm52/xplane_runtime_coverage.py \
        --profile-root "$LOCAL_PROFILE" \
        --output "$RANK_OUT/xplane-runtime-coverage.json" \
        > "$RANK_OUT/xplane-runtime-coverage.stdout" 2>&1
      COVERAGE_EXIT=$?
      set -e

      if [ -d "$LOCAL_PROFILE" ]; then
        mkdir -p "$ARTIFACT_PROFILE"
        cp -a "$LOCAL_PROFILE/." "$ARTIFACT_PROFILE/"
      fi
      sync

      if [ "$COVERAGE_EXIT" -ne 0 ]; then
        cat "$RANK_OUT/xplane-runtime-coverage.stdout"
        echo "GLM52_TIMING_CLOSURE_COVERAGE_FAILED exit=$COVERAGE_EXIT"
        exit "$COVERAGE_EXIT"
      fi

      python3 - "$OUT" "$LOCAL_PROFILE" "$SOURCE_COMMIT" <<'PY'
      import json
      import pathlib
      import sys

      out = pathlib.Path(sys.argv[1])
      profile_root = pathlib.Path(sys.argv[2])
      source_commit = sys.argv[3]
      xplanes = sorted(profile_root.rglob("*.xplane.pb")) if profile_root.exists() else []
      traces = sorted(profile_root.rglob("*.trace.json.gz")) if profile_root.exists() else []
      inventory = {
          "xplane": [{"path": str(path), "bytes": path.stat().st_size} for path in xplanes],
          "trace": [{"path": str(path), "bytes": path.stat().st_size} for path in traces],
      }
      (out / "profile-inventory.json").write_text(json.dumps(inventory, indent=2) + "\n")

      coverage = json.loads((out / "rank-0/xplane-runtime-coverage.json").read_text())
      e2e = json.loads((out / "workload/e2e-metrics.jsonl").read_text())
      profiled = json.loads((out / "workload/profile-metrics.jsonl").read_text())
      device = next(
          device
          for file_row in coverage["files"]
          for device in file_row["devices"]
          if len(device["model_coverages"]) == 1
      )
      model = device["model_coverages"][0]
      summary = {
          "source_commit": source_commit,
          "coverage_passed": coverage["passed"],
          "e2e_ttft_p50_ms": e2e["ttft_p50_s"] * 1000,
          "request_to_headers_p50_ms": e2e["request_to_headers_p50_ms"],
          "headers_to_first_token_p50_ms": e2e["headers_to_first_token_p50_ms"],
          "profiled_ttft_p50_ms": profiled["ttft_p50_s"] * 1000,
          "device_model_wall_ms": model["module_wall_ms"],
          "device_forward_span_ms": device["forward_device_span_ms"],
          "e2e_minus_device_span_ms": (
              e2e["ttft_p50_s"] * 1000 - device["forward_device_span_ms"]
          ),
          "headers_to_first_minus_device_span_ms": (
              e2e["headers_to_first_token_p50_ms"]
              - device["forward_device_span_ms"]
          ),
          "e2e_tpot_p50_ms": e2e["tpot_p50_ms"],
          "runtime_coverage": model,
      }
      (out / "timing-closure-summary.json").write_text(
          json.dumps(summary, indent=2) + "\n"
      )
      print(json.dumps(summary, indent=2))
      PY

      echo "GLM52_TIMING_CLOSURE_COMPLETE"
      BASH
    replica: 2
    image: python:3.12
    device_count: 8
    device_type: v7x
    device_topo: 2x2x2
    envs:
      JAX_COMPILATION_CACHE_DIR: /tmp/tpu_logs/jax-compilation-cache
      PIP_CACHE_DIR: /tmp/tpu_logs/pip-cache
      PYTHONUNBUFFERED: "1"
      SGLANG_PROFILE_MAX_HOSTS: "1"
      SGLANG_PROFILE_NUM_CHIPS_PER_TASK: "1"
      SGLANG_PROFILE_NUM_SPARSE_CORES_TO_TRACE: "1"
      SGLANG_PROFILE_NUM_SPARSE_CORE_TILES_TO_TRACE: "1"
      TMPDIR: /tmp/tpu_logs/tmp
      UV_CACHE_DIR: /tmp/tpu_logs/uv-cache
    mounts:
      - name: glm52-model
        type: gcs
        bucket: inference-model-storage-poc-tpu-hns
        prefix: GLM-5.2-FP8
        mount_path: /models/GLM-5.2-FP8
        read_only: true
        mount_options:
          - implicit-dirs
          - metadata-cache:ttl-secs:-1
          - metadata-cache:stat-cache-max-size-mb:-1
          - metadata-cache:type-cache-max-size-mb:-1
          - file-system:kernel-list-cache-ttl-secs:-1
          - read:enable-buffered-read:true
          - read:block-size-mb:32
          - read:max-blocks-per-handle:64
          - read:global-max-blocks:2048
          - read_ahead_kb=1024
