name: operator-profile-glm52-fused-rs-ep32-64k-contract-tuning-r1-20260820
exp_type: PROFILING
artifact_type: operator-profile
cluster_name: tpu-training-antgroup
profile: true
tags: [profile, operator-optimization, fused-moe, glm52, ep32, per-channel, exact-16chips, random-routing, contract-tuning]
model_version: glm-5.2-fused-rs-contract-tuning
role_to_task_spec:
  worker:
    replica: 4
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x4
    command: |
      set -eu
      ulimit -c 0
      export TMPDIR=/tmp/tpu_logs/tmp
      export PIP_CACHE_DIR=/tmp/tpu_logs/pip-cache
      export UV_CACHE_DIR=/tmp/tpu_logs/uv-cache
      export JAX_COMPILATION_CACHE_DIR=/tmp/tpu_logs/jax-cache
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      export FALCON_OPERATOR_RANK="${FALCON_JAX_PROCESS_ID:-${JOB_COMPLETION_INDEX:-0}}"
      ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/operator-artifact}"
      OUT="$ROOT/rank-$FALCON_OPERATOR_RANK"
      mkdir -p "$OUT/benchmark" "$OUT/profiling/xprof" "$OUT/compiler/llo"
      LIBTPU_PROFILE_ARGS="--xla_enable_custom_call_region_trace=true --xla_xprof_register_llo_debug_info=true --xla_mosaic_dump_to=$OUT/compiler/llo"
      export LIBTPU_INIT_ARGS="${LIBTPU_INIT_ARGS:+$LIBTPU_INIT_ARGS }$LIBTPU_PROFILE_ARGS"

      source_tar=/tmp/glm52-fused-rs-tuning-source-r1.tar.gz.part
      source_ready=/tmp/glm52-fused-rs-tuning-source-r1.ready
      attempt=0
      while [ ! -f "$source_ready" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 180 ]; then
          echo "timed out waiting for $source_ready" >&2
          exit 1
        fi
        sleep 5
      done
      test -f "$source_tar"
      echo 'e1d55f4241f70938af9a627bc07c280e02e06912e1dd96da1bc66744a959bab7  /tmp/glm52-fused-rs-tuning-source-r1.tar.gz.part' | sha256sum -c -

      mkdir -p /workspace/sglang-jax
      tar -xzf "$source_tar" -C /workspace/sglang-jax
      cd /workspace/sglang-jax

      python3 -m pip install -q -e './python[tpu]'
      export PYTHONPATH="/workspace/sglang-jax/python:/workspace/sglang-jax${PYTHONPATH:+:$PYTHONPATH}"

      if [ "$FALCON_OPERATOR_RANK" = "0" ]; then
        mkdir -p "$ROOT/profiling"
        python3 - <<'PY'
      import json
      import os
      from pathlib import Path
      root = Path(os.environ.get("ARTIFACT_LOCAL_DIR", "/tmp/operator-artifact"))
      manifest = {
          "schema_version": 1,
          "workflow": "operator-optimization",
          "operator_family": "fused_moe",
          "operator_name": "sglang_jax_glm52_fused_rs_contract_tuning",
          "hardware": {
              "device_type": "v7x",
              "chips": 16,
              "visible_devices": 32,
              "process_count": 4,
              "local_devices_per_process": 8,
              "physical_topology": "2x2x4",
              "logical_mesh": "data1-tensor32",
          },
          "dimensions": {
              "model": "glm-5.2",
              "ep_size": 32,
              "num_tokens": 65536,
              "routed_rows": 524288,
              "num_experts": 256,
              "top_k": 8,
              "hidden_size": 6144,
              "intermediate_size": 2048,
              "quant_mode": "per_channel_w8a8",
              "routing_mode": "seeded_random_gaussian_topk",
              "routing_seed": 42,
              "input_profile": "expert_distinct",
              "padding_active_tokens_per_device": 64,
              "tile_m_candidates": [128, 256, 384],
              "candidate_families": [
                  "full_n",
                  "split_gmm1_n",
                  "split_gmm2_n",
                  "split_both_n",
              ],
              "scope": "routed_backend",
          },
          "source": {
              "repository": "primatrix-glm/sglang-jax-private",
              "branch": "epic/glm_5_2",
              "base_commit": "e27fac67abadd7fff8f139cf6a7b069022ae9028",
              "migration_branch": "dev/glm52-rs-ep32-64k",
              "source_commit": "23ca0c4d5d23d0651ac798f55b77b53d7fc41f55",
              "delivery": "falcon-exp-cp-all-ranks",
              "source_sha256": "e1d55f4241f70938af9a627bc07c280e02e06912e1dd96da1bc66744a959bab7",
          },
          "correctness": {
              "reference": "canonical_full_n_rs",
              "rel_l2_threshold": 0.01,
              "invalid_padding_max_abs": 0.0,
              "v2_is_not_a_numerical_gate": True,
          },
          "timing": {
              "kernel": "per-iteration maximum strict Pallas device_duration_ps across all 32 devices",
              "backend": "per-iteration maximum blocking host wall time across all four processes",
          },
      }
      (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
      PY
      fi

      python3 -m benchmark.moe.bench_fused_rs_moe \
        --ep-size 32 \
        --tokens 65536 \
        --routing-seed 42 \
        --tune-rs \
        --tune-tile-ms 128,256,384 \
        --input-profile expert_distinct \
        --padding-active-tokens-per-device 64 \
        --correctness-rel-l2-threshold 0.01 \
        --warmup 2 \
        --iters 3 \
        --trace-root "$OUT/profiling/xprof/tuning" \
        --jsonl "$OUT/benchmark/metrics.jsonl"

      if [ "$FALCON_OPERATOR_RANK" = "0" ]; then
        env | sort | grep -E '^(LIBTPU_INIT_ARGS|XLA_FLAGS|JAX_|TF_XLA_FLAGS|SGLANG_JAX_|FALCON_OPERATOR_)=' > "$ROOT/profiling/env.txt" || true
        python3 - <<'PY' > "$ROOT/profiling/python-packages.txt"
      import importlib.metadata as md
      for package in ("jax", "jaxlib", "libtpu"):
          try:
              print(f"{package}={md.version(package)}")
          except md.PackageNotFoundError:
              print(f"{package}=MISSING")
      PY
      fi
