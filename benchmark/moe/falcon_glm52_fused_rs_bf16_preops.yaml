name: operator-profile-glm52-fused-rs-bf16-preops-r1-20260823
exp_type: PROFILING
artifact_type: operator-profile
cluster_name: tpu-training-antgroup
profile: true
tags: [profile, operator-optimization, fused-moe, fused-rs, glm52, ep32, bf16-allgather]
model_version: glm-5.2-fused-rs-bf16-preops
role_to_task_spec:
  worker:
    replica: 4
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x4
    command: |
      set -eu
      ulimit -c 0

      export FALCON_OPERATOR_RANK="${FALCON_JAX_PROCESS_ID:-${JOB_COMPLETION_INDEX:-0}}"
      ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/operator-artifact}"
      OUT="$ROOT/rank-$FALCON_OPERATOR_RANK"
      mkdir -p "$OUT/benchmark" "$OUT/profiling/xprof/raw" "$OUT/compiler/llo" "$OUT/compiler/hlo"

      export TMPDIR=/tmp/tpu_logs/tmp
      export PIP_CACHE_DIR=/tmp/tpu_logs/pip-cache
      export UV_CACHE_DIR=/tmp/tpu_logs/uv-cache
      export JAX_COMPILATION_CACHE_DIR=/tmp/tpu_logs/jax-cache
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      LIBTPU_PROFILE_ARGS="--xla_enable_custom_call_region_trace=true --xla_xprof_register_llo_debug_info=true --xla_mosaic_dump_to=$OUT/compiler/llo"
      export LIBTPU_INIT_ARGS="${LIBTPU_INIT_ARGS:+$LIBTPU_INIT_ARGS }$LIBTPU_PROFILE_ARGS"
      XLA_DUMP_FLAGS="--xla_dump_to=$OUT/compiler/hlo --xla_dump_hlo_as_text"
      export XLA_FLAGS="${XLA_FLAGS:+$XLA_FLAGS }$XLA_DUMP_FLAGS"

      source_tar=/tmp/glm52-fused-rs-bf16-preops-r1.tar.gz.part
      source_ready=/tmp/glm52-fused-rs-bf16-preops-r1.ready
      attempt=0
      while [ ! -f "$source_ready" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 360 ]; then
          echo "timed out waiting for $source_ready" >&2
          exit 1
        fi
        sleep 5
      done
      test -f "$source_tar"
      echo 'e69f272decd933aca6dde4c5c9a8a14d8e0c6317de24749ff84cca5ea719e825  /tmp/glm52-fused-rs-bf16-preops-r1.tar.gz.part' | sha256sum -c -

      mkdir -p /workspace/sglang-jax
      tar -xzf "$source_tar" -C /workspace/sglang-jax
      cd /workspace/sglang-jax
      python3 -m pip install -q -e './python[tpu]'
      export PYTHONPATH="/workspace/sglang-jax/python:/workspace/sglang-jax${PYTHONPATH:+:$PYTHONPATH}"

      if [ "$FALCON_OPERATOR_RANK" = "0" ]; then
        mkdir -p "$ROOT/profiling"
        python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      root = Path(os.environ.get("ARTIFACT_LOCAL_DIR", "/tmp/operator-artifact"))
      manifest = {
          "schema_version": 1,
          "workflow": "operator-optimization",
          "operator_family": "fused_moe",
          "operator_name": "sglang_jax_glm52_fused_rs_bf16_preops",
          "hardware": {
              "device_type": "v7x",
              "chips": 16,
              "visible_devices": 32,
              "process_count": 4,
              "local_devices_per_process": 8,
              "physical_topology": "2x2x4",
              "logical_mesh": "data1-tensor32",
          },
          "dimensions": {
              "model": "glm-5.2",
              "ep_size": 32,
              "num_tokens": 65536,
              "local_tokens_per_device": 2048,
              "hidden_size": 6144,
              "top_k": 8,
              "hidden_dtype": "bf16",
              "hidden_local_payload_bytes": 25165824,
              "hidden_logical_output_bytes_per_device": 805306368,
              "topk_is_precomputed": True,
              "includes_gate_topk": False,
              "scope": "hidden_allgather+topk_ids_allgather+pallas_rs",
              "rs_config": [128, 6144, 2048, 2048, 6144, 1, 1],
          },
          "source": {
              "branch": "dev/glm52-rs-bf16-allgather",
              "source_commit": "ac48ac9ebacf8e4e2c1c123b51bc98317eb9a791",
              "source_sha256": "e69f272decd933aca6dde4c5c9a8a14d8e0c6317de24749ff84cca5ea719e825",
          },
          "timing": {
              "method": "benchmark.utils.multiple_iteration_profile_from_trace",
              "device_selection": "existing representative PID semantics",
              "iterations": 5,
              "no_cross_device_global_critical_contract": True,
          },
      }
      (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
      PY
      fi

      python3 -m benchmark.moe.bench_fused_rs_moe \
        --ep-size 32 \
        --tokens 65536 \
        --routing-seed 42 \
        --rs-configs '128,6144,2048,2048,6144,1,1' \
        --rs-only \
        --no-check \
        --input-profile expert_distinct \
        --profile-breakdown \
        --warmup 2 \
        --iters 5 \
        --trace-root "$OUT/profiling/xprof/raw" \
        --jsonl "$OUT/benchmark/metrics.jsonl"

      find "$OUT/profiling/xprof/raw" -type f -name '*.xplane.pb' -exec cp '{}' "$OUT/profiling/xprof/" ';'
      trace_count=$(find "$OUT/profiling/xprof" -maxdepth 1 -type f -name '*.xplane.pb' | wc -l | tr -d ' ')
      if [ "$trace_count" -lt 1 ]; then
        echo "no xplane.pb captured for rank $FALCON_OPERATOR_RANK" >&2
        exit 1
      fi

      if [ "$FALCON_OPERATOR_RANK" = "0" ]; then
        env | sort | grep -E '^(LIBTPU_INIT_ARGS|XLA_FLAGS|JAX_|TF_XLA_FLAGS|SGLANG_JAX_|FALCON_OPERATOR_)=' > "$ROOT/profiling/env.txt" || true
        python3 - <<'PY' > "$ROOT/profiling/python-packages.txt"
      import importlib.metadata as md
      for package in ("jax", "jaxlib", "libtpu"):
          try:
              print(f"{package}={md.version(package)}")
          except md.PackageNotFoundError:
              print(f"{package}=MISSING")
      PY
      fi
