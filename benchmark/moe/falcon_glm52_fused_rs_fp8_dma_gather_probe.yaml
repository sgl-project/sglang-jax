name: glm52-fused-rs-fp8-dma-gather-probe-r1-20260824
exp_type: TRAINING
artifact_type: GCS
cluster_name: tpu-training-antgroup
priority: 0
tags: [correctness, fused-moe, fused-rs, glm52, fp8-hidden-ag, dma-probe]
config: '{"device_type":"v7x","physical_chips":4,"visible_devices":8,"probe":"irregular_hbm_to_vmem_dma","source_commit":"050dc57cf0c4cbeafaa3d24d1fc0bc6b2e9be49c","source_sha256":"518b17ba1a7d82d3b39b08d0ef5345d9a643846210d57eed75cca960afec4a75"}'
role_to_task_spec:
  worker:
    replica: 1
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x1
    command: |
      set -eu
      ulimit -c 0

      ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/dma-probe-artifact}"
      OUT="$ROOT/rank-0"
      mkdir -p "$OUT/benchmark"

      export TMPDIR=/tmp/tpu_logs/tmp
      export PIP_CACHE_DIR=/tmp/tpu_logs/pip-cache
      export UV_CACHE_DIR=/tmp/tpu_logs/uv-cache
      export JAX_COMPILATION_CACHE_DIR=/tmp/tpu_logs/jax-cache
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      source_tar=/tmp/glm52-fused-rs-fp8-dma-gather-probe-r1.tar.gz.part
      source_ready=/tmp/glm52-fused-rs-fp8-dma-gather-probe-r1.ready
      attempt=0
      while [ ! -f "$source_ready" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 360 ]; then
          echo "timed out waiting for $source_ready" >&2
          exit 1
        fi
        sleep 5
      done
      test -f "$source_tar"
      echo '518b17ba1a7d82d3b39b08d0ef5345d9a643846210d57eed75cca960afec4a75  /tmp/glm52-fused-rs-fp8-dma-gather-probe-r1.tar.gz.part' | sha256sum -c -

      mkdir -p /workspace/sglang-jax
      tar -xzf "$source_tar" -C /workspace/sglang-jax
      cd /workspace/sglang-jax
      python3 -m pip install -q -e './python[tpu]'
      export PYTHONPATH="/workspace/sglang-jax/python:/workspace/sglang-jax${PYTHONPATH:+:$PYTHONPATH}"

      python3 -m benchmark.moe.bench_fused_rs_fp8_dma_gather_probe \
        --jsonl "$OUT/benchmark/metrics.jsonl"

      test "$(wc -l < "$OUT/benchmark/metrics.jsonl")" -eq 5
