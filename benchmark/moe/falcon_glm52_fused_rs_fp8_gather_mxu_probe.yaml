name: glm52-fused-rs-fp8-gather-mxu-probe-r2-20260824
exp_type: TRAINING
artifact_type: GCS
cluster_name: tpu-training-antgroup
priority: 0
tags: [correctness, fused-moe, fused-rs, glm52, fp8-hidden-ag, mxu-probe]
config: '{"device_type":"v7x","physical_chips":4,"visible_devices":8,"probe":"gathered_scratch_unscaled_mxu","source_commit":"b8b32faa41a13c632df97160053abb82d0c52472","source_sha256":"ee1338228bd453671f66f899155b14bc9acb15dae99e8d858200820d58d01e7c"}'
role_to_task_spec:
  worker:
    replica: 1
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x1
    command: |
      set -eu
      ulimit -c 0

      ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/mxu-probe-artifact}"
      OUT="$ROOT/rank-0"
      mkdir -p "$OUT/benchmark"

      export TMPDIR=/tmp/tpu_logs/tmp
      export PIP_CACHE_DIR=/tmp/tpu_logs/pip-cache
      export UV_CACHE_DIR=/tmp/tpu_logs/uv-cache
      export JAX_COMPILATION_CACHE_DIR=/tmp/tpu_logs/jax-cache
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      source_tar=/tmp/glm52-fused-rs-fp8-gather-mxu-probe-r2.tar.gz.part
      source_ready=/tmp/glm52-fused-rs-fp8-gather-mxu-probe-r2.ready
      attempt=0
      while [ ! -f "$source_ready" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 360 ]; then
          echo "timed out waiting for $source_ready" >&2
          exit 1
        fi
        sleep 5
      done
      test -f "$source_tar"
      echo 'ee1338228bd453671f66f899155b14bc9acb15dae99e8d858200820d58d01e7c  /tmp/glm52-fused-rs-fp8-gather-mxu-probe-r2.tar.gz.part' | sha256sum -c -

      mkdir -p /workspace/sglang-jax
      tar -xzf "$source_tar" -C /workspace/sglang-jax
      cd /workspace/sglang-jax
      python3 -m pip install -q -e './python[tpu]'
      export PYTHONPATH="/workspace/sglang-jax/python:/workspace/sglang-jax${PYTHONPATH:+:$PYTHONPATH}"

      python3 -m benchmark.moe.bench_fused_rs_fp8_gather_mxu_probe \
        --jsonl "$OUT/benchmark/metrics.jsonl"

      test "$(wc -l < "$OUT/benchmark/metrics.jsonl")" -eq 5
