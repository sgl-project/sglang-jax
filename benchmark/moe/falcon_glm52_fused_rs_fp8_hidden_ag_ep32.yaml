name: operator-profile-glm52-fused-rs-fp8-hidden-ag-ep32-r1-20260824
exp_type: PROFILING
artifact_type: operator-profile
cluster_name: tpu-training-antgroup
profile: true
tags: [profile, operator-optimization, fused-moe, fused-rs, glm52, ep32, fp8-hidden-ag]
model_version: glm-5.2-fused-rs-fp8-hidden-ag-ep32
role_to_task_spec:
  worker:
    replica: 4
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x4
    command: |
      set -eu
      ulimit -c 0

      export FALCON_OPERATOR_RANK="${FALCON_JAX_PROCESS_ID:-${JOB_COMPLETION_INDEX:-0}}"
      ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/operator-artifact}"
      OUT="$ROOT/rank-$FALCON_OPERATOR_RANK"
      mkdir -p "$OUT/benchmark" "$OUT/profiling/xprof/raw" "$OUT/compiler/llo" "$OUT/compiler/hlo"

      export TMPDIR=/tmp/tpu_logs/tmp
      export PIP_CACHE_DIR=/tmp/tpu_logs/pip-cache
      export UV_CACHE_DIR=/tmp/tpu_logs/uv-cache
      export JAX_COMPILATION_CACHE_DIR=/tmp/tpu_logs/jax-cache
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      LIBTPU_PROFILE_ARGS="--xla_enable_custom_call_region_trace=true --xla_xprof_register_llo_debug_info=true --xla_mosaic_dump_to=$OUT/compiler/llo"
      export LIBTPU_INIT_ARGS="${LIBTPU_INIT_ARGS:+$LIBTPU_INIT_ARGS }$LIBTPU_PROFILE_ARGS"
      XLA_DUMP_FLAGS="--xla_dump_to=$OUT/compiler/hlo --xla_dump_hlo_as_text"
      export XLA_FLAGS="${XLA_FLAGS:+$XLA_FLAGS }$XLA_DUMP_FLAGS"

      source_tar=/tmp/glm52-fused-rs-fp8-hidden-ag-ep32-r1.tar.gz.part
      source_ready=/tmp/glm52-fused-rs-fp8-hidden-ag-ep32-r1.ready
      attempt=0
      while [ ! -f "$source_ready" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 360 ]; then
          echo "timed out waiting for $source_ready" >&2
          exit 1
        fi
        sleep 5
      done
      test -f "$source_tar"
      echo '31d5bbfd5b87073432124efc15ece42696c4a41673609f1b9226a3ff0531e2fa  /tmp/glm52-fused-rs-fp8-hidden-ag-ep32-r1.tar.gz.part' | sha256sum -c -

      mkdir -p /workspace/sglang-jax
      tar -xzf "$source_tar" -C /workspace/sglang-jax
      cd /workspace/sglang-jax
      python3 -m pip install -q -e './python[tpu]'
      export PYTHONPATH="/workspace/sglang-jax/python:/workspace/sglang-jax${PYTHONPATH:+:$PYTHONPATH}"

      if [ "$FALCON_OPERATOR_RANK" = "0" ]; then
        mkdir -p "$ROOT/profiling"
        python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      root = Path(os.environ.get("ARTIFACT_LOCAL_DIR", "/tmp/operator-artifact"))
      manifest = {
          "schema_version": 1,
          "workflow": "operator-optimization",
          "operator_family": "fused_moe",
          "operator_name": "sglang_jax_glm52_fused_rs_fp8_hidden_ag_ep32",
          "hardware": {
              "device_type": "v7x",
              "chips": 16,
              "visible_devices": 32,
              "process_count": 4,
              "local_devices_per_process": 8,
              "physical_topology": "2x2x4",
              "logical_mesh": "data1-tensor32",
          },
          "dimensions": {
              "model": "glm-5.2",
              "ep_size": 32,
              "num_tokens": 65536,
              "local_tokens_per_device": 2048,
              "hidden_size": 6144,
              "top_k": 8,
              "compute_dtype": "bf16",
              "wire_dtypes": ["bf16", "fp8_e4m3fn"],
              "activation_scale": "one_fp32_per_ep_rank_physical_hidden_shard",
              "rs_config": [256, 6144, 1024, 2048, 1024, 2, 2],
              "variants": ["bf16-hidden-ag", "fp8-per-tensor-hidden-ag"],
          },
          "source": {
              "branch": "dev/glm52-rs-bf16-allgather",
              "source_commit": "7f6ffc37a22beb8aa112490182b3c638f2aa9e8c",
              "source_sha256": "31d5bbfd5b87073432124efc15ece42696c4a41673609f1b9226a3ff0531e2fa",
          },
          "correctness": {
              "reference_variant": "bf16-hidden-ag",
              "final_output_rel_l2_threshold": 0.01,
              "checks_all_active": True,
              "checks_padded_active_rows": True,
              "checks_same_config_padding_invariance": True,
              "checks_invalid_padding_zero": True,
          },
          "timing": {
              "method": "benchmark.utils.multiple_iteration_timeit_from_trace",
              "iterations": 5,
              "representative_pid_semantics": True,
              "no_cross_device_global_critical_contract": True,
          },
      }
      (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
      PY
      fi

      python3 -m benchmark.moe.bench_fused_rs_fp8_hidden_ag \
        --ep-size 32 \
        --tokens 65536 \
        --routing-seed 42 \
        --padding-active-tokens-per-device 64 \
        --warmup 2 \
        --iters 5 \
        --trace-root "$OUT/profiling/xprof/raw" \
        --jsonl "$OUT/benchmark/fp8_hidden_ag.jsonl"
      cp "$OUT/benchmark/fp8_hidden_ag.jsonl" "$OUT/benchmark/metrics.jsonl"

      trace_index=0
      for trace_file in $(find "$OUT/profiling/xprof/raw" -type f -name '*.xplane.pb'); do
        cp "$trace_file" "$OUT/profiling/xprof/$trace_index-$(basename "$trace_file")"
        trace_index=$((trace_index + 1))
      done
      if [ "$trace_index" -lt 4 ]; then
        echo "expected at least four xplane.pb traces for rank $FALCON_OPERATOR_RANK; got $trace_index" >&2
        exit 1
      fi

      if [ "$FALCON_OPERATOR_RANK" = "0" ]; then
        env | sort | grep -E '^(LIBTPU_INIT_ARGS|XLA_FLAGS|JAX_|TF_XLA_FLAGS|SGLANG_JAX_|FALCON_OPERATOR_)=' > "$ROOT/profiling/env.txt" || true
        python3 - <<'PY' > "$ROOT/profiling/python-packages.txt"
      import importlib.metadata as md
      for package in ("jax", "jaxlib", "libtpu"):
          try:
              print(f"{package}={md.version(package)}")
          except md.PackageNotFoundError:
              print(f"{package}=MISSING")
      PY
      fi
