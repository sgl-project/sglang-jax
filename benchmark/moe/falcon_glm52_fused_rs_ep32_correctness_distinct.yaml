role_to_task_spec:
  worker:
    replica: 4
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x4
    envs:
      PYTHONUNBUFFERED: "1"
      TMPDIR: /tmp/tpu_logs/tmp
      PIP_CACHE_DIR: /tmp/tpu_logs/pip-cache
      UV_CACHE_DIR: /tmp/tpu_logs/uv-cache
      JAX_COMPILATION_CACHE_DIR: /tmp/tpu_logs/jax-compilation-cache
    command: |
      bash <<'BASH'
      set -euo pipefail
      ulimit -c 0

      export TMPDIR="${TMPDIR:-/tmp/tpu_logs/tmp}"
      export PIP_CACHE_DIR="${PIP_CACHE_DIR:-/tmp/tpu_logs/pip-cache}"
      export UV_CACHE_DIR="${UV_CACHE_DIR:-/tmp/tpu_logs/uv-cache}"
      export JAX_COMPILATION_CACHE_DIR="${JAX_COMPILATION_CACHE_DIR:-/tmp/tpu_logs/jax-compilation-cache}"
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      RANK="${FALCON_JAX_PROCESS_ID:-${JOB_COMPLETION_INDEX:-0}}"
      ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/glm52-rs-backend-correctness-artifact}"
      RANK_OUT="$ROOT/rank-$RANK"
      mkdir -p "$RANK_OUT/benchmark"

      source_tar=/tmp/glm52-fused-rs-correctness-source.tar.gz.part
      source_ready=/tmp/glm52-fused-rs-correctness-source.ready
      attempt=0
      while [ ! -f "$source_ready" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 360 ]; then
          echo "timed out waiting for $source_ready" >&2
          exit 1
        fi
        sleep 5
      done
      test -f "$source_tar"
      echo 'd1673d33924c55b8ae7ca4a5c3c1a0368b557e7bfaeb442d7d2c6b6f5d423172  /tmp/glm52-fused-rs-correctness-source.tar.gz.part' | sha256sum -c -

      mkdir -p /workspace/sglang-jax
      tar -xzf "$source_tar" -C /workspace/sglang-jax
      cd /workspace/sglang-jax
      python3 -m pip install -q -e './python[tpu]'
      export PYTHONPATH="/workspace/sglang-jax/python:/workspace/sglang-jax${PYTHONPATH:+:$PYTHONPATH}"

      python3 - <<'PY' > "$RANK_OUT/runtime-versions.txt"
      import importlib.metadata as md
      for package in ("jax", "jaxlib", "libtpu", "sglang-jax"):
          try:
              print(f"{package}={md.version(package)}")
          except md.PackageNotFoundError:
              print(f"{package}=MISSING")
      PY

      if [ "$RANK" = "0" ]; then
        python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      root = Path(os.environ.get("ARTIFACT_LOCAL_DIR", "/tmp/glm52-rs-backend-correctness-artifact"))
      manifest = {
          "schema_version": 1,
          "workflow": "moe-backend-correctness",
          "operator_family": "fused_moe",
          "operator_name": "sglang_jax_glm52_fused_rs",
          "hardware": {
              "cluster": "tpu-training-antgroup",
              "device_type": "v7x",
              "chips": 16,
              "visible_devices": 32,
              "process_count": 4,
              "local_devices_per_process": 8,
              "physical_topology": "2x2x4",
              "logical_mesh": "data1-tensor32",
          },
          "dimensions": {
              "model": "glm-5.2",
              "ep_size": 32,
              "num_tokens": [64, 65536],
              "routed_rows": [512, 524288],
              "num_experts": 256,
              "top_k": 8,
              "hidden_size": 6144,
              "intermediate_size": 2048,
              "quant_mode": "per_channel_w8a8",
              "routed_ffn2_activation": "fused_v2_compatible_bf16",
              "routing_mode": "seeded_random_gaussian_topk",
              "routing_seed": 42,
              "input_profile": "expert_distinct_positive",
              "comparisons": [
                  "rs_vs_explicit_signed_micro_reference",
                  "v2_vs_rs_routed_only",
                  "v2_vs_rs_routed_plus_shared",
                  "v2_vs_rs_shared_delta",
              ],
          },
          "source": {
              "repository": "primatrix-glm/sglang-jax-private",
              "base_commit": "e27fac67abadd7fff8f139cf6a7b069022ae9028",
              "migration_branch": "dev/glm52-rs-ep32-64k",
              "source_sha256": "d1673d33924c55b8ae7ca4a5c3c1a0368b557e7bfaeb442d7d2c6b6f5d423172",
          },
          "acceptance": {
              "all_finite": True,
              "max_rel_l2": 0.10,
              "timing_claim": False,
          },
      }
      (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
      PY
      fi

      python3 -m benchmark.moe.check_fused_rs_moe_accuracy \
        --tokens 64,65536 \
        --ep-size 32 \
        --routing-seed 42 \
        --max-rel-l2 0.10 \
        --jsonl "$RANK_OUT/benchmark/metrics.jsonl"
      BASH
