name: glm52-fused-rs-fp8-hidden-ag-scale-granularity-probe-r3-20260824
exp_type: TRAINING
artifact_type: GCS
cluster_name: tpu-training-antgroup
priority: 0
tags: [correctness, fused-moe, fused-rs, glm52, fp8-hidden-ag, scale-probe]
config: '{"device_type":"v7x","physical_chips":4,"visible_devices":8,"ep_size":8,"num_tokens":32768,"scale_multipliers":[1.0],"scale_granularities":["tensor","row"],"consumer":"direct_prequantized_fp8_row0_aligned","source_commit":"7de190fc2ca2d4ef218f8ac9d59436640a6786e9","source_sha256":"f757ce940b40ae6acdd204b8b8d331254828528fe08b2e685ce07f566e374f21"}'
role_to_task_spec:
  worker:
    replica: 1
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x1
    command: |
      set -eu
      ulimit -c 0

      ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/scale-probe-artifact}"
      OUT="$ROOT/rank-0"
      mkdir -p "$OUT/benchmark"

      export TMPDIR=/tmp/tpu_logs/tmp
      export PIP_CACHE_DIR=/tmp/tpu_logs/pip-cache
      export UV_CACHE_DIR=/tmp/tpu_logs/uv-cache
      export JAX_COMPILATION_CACHE_DIR=/tmp/tpu_logs/jax-cache
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$JAX_COMPILATION_CACHE_DIR"

      source_tar=/tmp/glm52-fused-rs-fp8-hidden-ag-scale-probe-r3.tar.gz.part
      source_ready=/tmp/glm52-fused-rs-fp8-hidden-ag-scale-probe-r3.ready
      attempt=0
      while [ ! -f "$source_ready" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 360 ]; then
          echo "timed out waiting for $source_ready" >&2
          exit 1
        fi
        sleep 5
      done
      test -f "$source_tar"
      echo 'f757ce940b40ae6acdd204b8b8d331254828528fe08b2e685ce07f566e374f21  /tmp/glm52-fused-rs-fp8-hidden-ag-scale-probe-r3.tar.gz.part' | sha256sum -c -

      mkdir -p /workspace/sglang-jax
      tar -xzf "$source_tar" -C /workspace/sglang-jax
      cd /workspace/sglang-jax
      python3 -m pip install -q -e './python[tpu]'
      export PYTHONPATH="/workspace/sglang-jax/python:/workspace/sglang-jax${PYTHONPATH:+:$PYTHONPATH}"

      python3 -m benchmark.moe.bench_fused_rs_fp8_hidden_ag_scale_probe \
        --ep-size 8 \
        --tokens 32768 \
        --routing-seed 42 \
        --scale-multipliers 1.0 \
        --scale-granularities tensor,row \
        --jsonl "$OUT/benchmark/metrics.jsonl"

      test "$(wc -l < "$OUT/benchmark/metrics.jsonl")" -eq 2
